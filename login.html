<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://challenges.cloudflare.com">
  <link rel="dns-prefetch" href="https://challenges.cloudflare.com">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | 1eak.cool</title>
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="stylesheet" href="style.css?v=2.7.1">
</head>
<body class="auth-page">

<header class="auth-header"><a class="brand" href="/index.html" aria-label="1eak.cool 首页"><svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3v26M3 16h26M7 7l18 18M7 25 25 7" stroke="currentColor" stroke-width="2.1"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg><span class="logo">1eak<span class="dot">.</span>cool</span></a><span class="auth-header-note">一个记录生活的小站</span></header>
<main class="auth-shell">
  <aside class="login-intro"><p class="eyebrow"><span class="eyebrow-line"></span> A SPACE OF YOUR OWN / 私人手记</p><h1>欢迎回来，<br>继续你的<span>故事。</span></h1><p class="login-intro-note">把灵感写下来，把日常留在这里。<br>这是属于你和朋友们的安静角落。</p><div class="login-intro-signature"><span aria-hidden="true">✳</span><p>日子慢慢过，<br>故事慢慢写。</p></div></aside>
<div class="login-card">
  <h2 class="auth-heading">进入小站</h2>
  <p class="logo-sub">登录账号，接着记录与分享。</p>

  <div class="theme-row">
    <div class="theme-toggle" id="themeToggle" role="group" aria-label="显示主题">
      <button onclick="setTheme('light')" id="themeLight" title="日间" aria-label="日间主题"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></button>
      <button onclick="setTheme('dark')" id="themeDark" class="active" title="夜间" aria-label="夜间主题"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg></button>
      <button onclick="setTheme('auto')" id="themeAuto" title="跟随系统" aria-label="跟随系统主题"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" onclick="switchTab('login', this)">登录</button>
    <button type="button" class="tab" onclick="switchTab('register', this)">注册</button>
  </div>

  <form id="authForm">
    <label for="username" class="auth-label">用户名</label>
    <input type="text" id="username" class="form-control" placeholder="你的用户名" autocomplete="username" required>
    <label for="password" class="auth-label">密码</label>
    <input type="password" id="password" class="form-control" placeholder="输入密码" autocomplete="current-password" required>
    <div id="msgBox" class="msg-box" role="status" aria-live="polite"></div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAACDgXdJPWAee7ZdB" data-theme="auto"></div>
    <button type="submit" class="btn btn-primary" id="submitBtn">登录</button>
  </form>
  <p class="auth-footnote">私人小站 · 仅供自己和好友使用</p>
</div>
</main>

<script>
  let currentMode = 'login';
  const msgBox = document.getElementById('msgBox');
  const submitBtn = document.getElementById('submitBtn');
  const passInput = document.getElementById('password');

  // 主题
  function getSavedTheme() { return localStorage.getItem('theme') || 'dark'; }
  function applyTheme(theme) {
    document.documentElement.removeAttribute('data-theme');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', theme);
    document.getElementById('themeLight').classList.toggle('active', theme === 'light');
    document.getElementById('themeDark').classList.toggle('active', theme === 'dark');
    document.getElementById('themeAuto').classList.toggle('active', theme === 'auto');
  }
  window.setTheme = applyTheme;
  applyTheme(getSavedTheme());

  fetch('/api/user').then(res => res.json()).then(data => {
    if (data.loggedIn) window.location.href = '/index.html';
  });

  fetch('/api/config')
    .then(res => res.json())
    .then(data => {
      const widget = document.querySelector('.cf-turnstile');
      if (!data.turnstileEnabled) { if (widget) widget.style.display = 'none'; window.isTurnstileDisabled = true; }
    })
    .catch(() => { });

  function switchTab(mode, el) {
    currentMode = mode;
    const tabs = Array.from(document.querySelectorAll('.tab'));
    tabs.forEach(t => t.classList.remove('active'));
    const activeTab = el || tabs.find(t => t.textContent.trim() === (mode === 'login' ? '登录' : '注册'));
    if (activeTab) activeTab.classList.add('active');
    msgBox.textContent = '';
    msgBox.className = 'msg-box';

    if (mode === 'login') {
      submitBtn.textContent = '登录';
      passInput.placeholder = '输入密码'; passInput.autocomplete = 'current-password';
    } else if (mode === 'register') {
      submitBtn.textContent = '注册';
      passInput.placeholder = '设置密码'; passInput.autocomplete = 'new-password';
    }
  }

  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const formData = new FormData(e.target);
    const token = formData.get('cf-turnstile-response');

    if (!window.isTurnstileDisabled && !token) { msgBox.textContent = '请完成人机验证'; return; }

    submitBtn.disabled = true; submitBtn.textContent = '处理中...'; msgBox.textContent = '';

    let endpoint = '/api/auth/login';
    let body = { username: u, password: p, turnstileToken: token };

    if (currentMode === 'register') { endpoint = '/api/auth/register'; }

    try {
      const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.success) {
        if (currentMode === 'login') { window.location.href = '/index.html'; }
        else if (currentMode === 'register') {
          msgBox.textContent = '注册成功，请登录。';
          msgBox.className = 'msg-box success';
          currentMode = 'login';
          document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.trim() === '登录'));
          passInput.placeholder = '输入密码'; passInput.autocomplete = 'current-password';
          passInput.value = '';
          submitBtn.textContent = '登录';
          if (window.turnstile) turnstile.reset();
        }
      } else {
        msgBox.textContent = data.error || '操作失败';
        msgBox.className = 'msg-box';
        if (window.turnstile) turnstile.reset();
      }
    } catch (err) {
      msgBox.textContent = '连接中断，请重试';
      if (window.turnstile) turnstile.reset();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = currentMode === 'register' ? '注册' : '登录';
    }
  };
</script>
</body>
</html>
