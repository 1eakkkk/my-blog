name: Release check

on:
  push:
  pull_request:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check all frontend JavaScript
        run: for file in ./*.js; do node --check "$file"; done
      - name: Check all backend JavaScript
        run: find functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --test tools/*.test.mjs
      - run: node tools/check-release.mjs
